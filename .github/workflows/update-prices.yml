name: Mise à jour des prix (ancien pipeline, lancement manuel)

# REMPLACÉ par l'agent quotidien (.github/workflows/daily-agent.yml,
# scripts/agent/), qui reprend la même méthode eBay avec des garde-fous
# supplémentaires (reprise, échéance 10 h Paris, rapport, composants
# manquants). Ce workflow n'a plus de déclencheur planifié : deux écrivains
# automatiques sur les mêmes fichiers se marcheraient dessus. Il reste
# disponible en lancement manuel (onglet Actions) pour mémoire / dépannage.
#
# Le rappel hebdomadaire du lundi (qui échouait : libellé « price-review »
# inexistant) est repris par agent-watchdog.yml, qui crée le libellé.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rafraîchir les prix (API eBay Browse)
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: node scripts/update-prices.mjs

      - name: Commit et push si des prix ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/priceOverrides PRICE_REVIEW.md
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "chore: mise à jour des prix (eBay, ancien pipeline manuel)"
            git pull --rebase origin main
            git push
          fi
